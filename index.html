<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ezitech IMS - Inventory Dashboard</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="grid min-h-screen grid-cols-1 md:grid-cols-[220px_1fr]">

    <aside id="sidebar" class="hidden fixed inset-y-0 left-0 z-10 w-56 flex-col bg-gray-800 text-white md:sticky md:top-0 md:flex md:h-screen md:w-auto">
      <div class="flex items-center gap-2 border-b border-gray-600 p-4">
        <i data-lucide="boxes" class="h-6 w-6 text-blue-500"></i>
        <div>
          <p class="font-bold">Ezitech IMS</p>
          <p class="text-xs text-gray-400">Inventory Management System</p>
        </div>
      </div>

      <nav class="flex-1 p-3 text-sm">
        <a href="#" class="mb-1 flex items-center gap-2 rounded bg-gray-600 p-2">
          <i data-lucide="layout-dashboard" class="h-4 w-4"></i> Dashboard
        </a>
        
      </nav>

    </aside>

    <div class="min-w-0">

      <header class="flex items-center gap-3 border-b border-gray-300 bg-white p-4">
        <button id="menu-button" class="rounded p-2 hover:bg-gray-100 md:hidden">
          <i data-lucide="menu" class="h-5 w-5"></i>
        </button>

        <input id="search" type="text" placeholder="Search assets..." aria-label="Search assets"
               class="w-full max-w-md rounded border border-gray-300 px-3 py-2 text-sm">

        <button id="open-add" class="ml-auto flex items-center gap-1 rounded bg-blue-600 px-4 py-2 text-sm text-white hover:bg-blue-700">
          <i data-lucide="plus" class="h-4 w-4"></i> Add
        </button>
      </header>

      <main class="p-4 md:p-6">
        <h1 class="text-2xl font-bold">Inventory Dashboard</h1>
        <p class="mb-4 text-sm text-gray-500">Manage hardware assets in the training labs.</p>

        <div id="message" class="hidden"></div>

        <div class="mb-6 grid grid-cols-2 gap-4 md:grid-cols-4">
          <div class="rounded border border-gray-300 bg-white p-4">
            <p class="text-sm text-gray-500">Total assets</p>
            <p id="stat-total" class="text-2xl font-bold">0</p>
          </div>
          <div class="rounded border border-gray-300 bg-white p-4">
            <p class="text-sm text-green-600">Available</p>
            <p id="stat-available" class="text-2xl font-bold">0</p>
          </div>
          <div class="rounded border border-gray-300 bg-white p-4">
            <p class="text-sm text-blue-600">Assigned</p>
            <p id="stat-assigned" class="text-2xl font-bold">0</p>
          </div>
          <div class="rounded border border-gray-300 bg-white p-4">
            <p class="text-sm text-yellow-600">Under Maintenance</p>
            <p id="stat-maintenance" class="text-2xl font-bold">0</p>
          </div>
        </div>

        <section id="assets" class="rounded border border-gray-300 bg-white">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-300 p-4">
            <p id="result-count" class="text-sm text-gray-500"></p>
            <div class="flex flex-wrap gap-2">
              <select id="filter-status" aria-label="Filter by status" class="rounded border border-gray-300 px-2 py-2 text-sm">
                <option value="">All statuses</option>
              </select>
              <select id="filter-category" aria-label="Filter by category" class="rounded border border-gray-300 px-2 py-2 text-sm">
                <option value="">All categories</option>
              </select>
              <select id="filter-location" aria-label="Filter by location" class="rounded border border-gray-300 px-2 py-2 text-sm">
                <option value="">All locations</option>
              </select>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full min-w-[700px] text-left text-sm">
              <thead class="bg-gray-100 text-gray-600">
                <tr>
                  <th class="p-3"><button class="sort-button font-bold" data-sort="id">ID <span></span></button></th>
                  <th class="p-3"><button class="sort-button font-bold" data-sort="name">Name <span></span></button></th>
                  <th class="p-3"><button class="sort-button font-bold" data-sort="category">Category <span></span></button></th>
                  <th class="p-3"><button class="sort-button font-bold" data-sort="location">Location <span></span></button></th>
                  <th class="p-3"><button class="sort-button font-bold" data-sort="status">Status <span></span></button></th>
                  <th class="p-3"><button class="sort-button font-bold" data-sort="last_updated">Last Updated <span></span></button></th>
                  <th class="p-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="asset-rows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="add-dialog" class="m-auto w-full max-w-md rounded-lg p-0 backdrop:bg-black backdrop:opacity-50">
    <form id="add-form" class="p-6" novalidate>
      <h2 class="mb-1 text-lg font-bold">Add New Asset</h2>
      <p class="mb-4 text-sm text-gray-500">All fields are required.</p>

      <label for="f-id" class="mb-1 block text-sm font-bold">Asset ID</label>
      <input id="f-id" type="text" placeholder="AST-0021" maxlength="8" class="w-full rounded border border-gray-300 px-3 py-2 text-sm">
      <p id="e-id" class="mb-2 h-4 text-xs text-red-600"></p>

      <label for="f-name" class="mb-1 block text-sm font-bold">Asset Name</label>
      <input id="f-name" type="text" placeholder="e.g. Dell Latitude 5440" maxlength="100" class="w-full rounded border border-gray-300 px-3 py-2 text-sm">
      <p id="e-name" class="mb-2 h-4 text-xs text-red-600"></p>

      <label for="f-category" class="mb-1 block text-sm font-bold">Category</label>
      <select id="f-category" class="w-full rounded border border-gray-300 px-3 py-2 text-sm"></select>
      <p id="e-category" class="mb-2 h-4 text-xs text-red-600"></p>

      <label for="f-location" class="mb-1 block text-sm font-bold">Location</label>
      <select id="f-location" class="w-full rounded border border-gray-300 px-3 py-2 text-sm"></select>
      <p id="e-location" class="mb-2 h-4 text-xs text-red-600"></p>

      <label for="f-status" class="mb-1 block text-sm font-bold">Status</label>
      <select id="f-status" class="w-full rounded border border-gray-300 px-3 py-2 text-sm"></select>
      <p id="e-status" class="mb-2 h-4 text-xs text-red-600"></p>

      <div class="mt-4 flex justify-end gap-2">
        <button type="button" id="add-cancel" class="rounded border border-gray-300 px-4 py-2 text-sm hover:bg-gray-100">Cancel</button>
        <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-sm text-white hover:bg-blue-700">Save Asset</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="m-auto w-full max-w-sm rounded-lg p-0 backdrop:bg-black backdrop:opacity-50">
    <div class="p-6">
      <h2 class="mb-2 text-lg font-bold">Delete Asset?</h2>
      <p id="delete-text" class="text-sm text-gray-600"></p>
      <div class="mt-6 flex justify-end gap-2">
        <button id="delete-cancel" class="rounded border border-gray-300 px-4 py-2 text-sm hover:bg-gray-100">Cancel</button>
        <button id="delete-confirm" class="rounded bg-red-600 px-4 py-2 text-sm text-white hover:bg-red-700">Delete</button>
      </div>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
